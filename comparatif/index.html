<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Smart Eco Technique — comparatif V1 / final · Everywhere</title>
<style>
:root{--bg:#0f1512;--bar:#161d18;--ink:#eef2ee;--ink2:#93a89a;--line:#26312a;--acc:#1c9a4f}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:ui-monospace,'Cascadia Code','Segoe UI Mono',monospace;display:flex;flex-direction:column;overflow:hidden}
.bar{background:var(--bar);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 16px;flex-wrap:wrap}
.who{display:flex;align-items:baseline;gap:10px;min-width:0}
.who .ev{font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.who .ev b{color:var(--acc)}
.who .cl{font-size:12px;color:var(--ink2);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tog{display:flex;gap:6px;align-items:center}
.tog button{font-family:inherit;font-size:12px;letter-spacing:.02em;color:var(--ink2);background:transparent;border:1px solid var(--line);border-radius:3px;padding:8px 13px;cursor:pointer;transition:.15s;white-space:nowrap}
.tog button:hover{color:var(--ink);border-color:#3a463d}
.tog button.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
.tog button .sub{color:inherit;opacity:.72;font-weight:400}
.tog button.on .sub{opacity:.9}
.open{font-size:12px;color:var(--ink2);border:1px solid var(--line);border-radius:3px;padding:8px 12px;text-decoration:none;white-space:nowrap}
.open:hover{color:var(--acc);border-color:var(--acc)}
.stage{flex:1;position:relative;background:#000}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
@media(max-width:680px){.who .cl{display:none}}
</style>
</head>
<body>
<div class="bar">
  <div class="who"><span class="ev">ev<b>e</b>rywhere</span><span class="cl">· comparatif — Smart Eco Technique, électricien à Maubeuge</span></div>
  <div class="tog" role="tablist" aria-label="Choisir la version">
    <button id="b1" role="tab" aria-selected="false" onclick="show('v1')">V1 <span class="sub">· première maquette</span></button>
    <button id="b2" role="tab" aria-selected="true" class="on" onclick="show('final')">Version finale <span class="sub">· vert / bleu</span></button>
  </div>
  <a id="open" class="open" href="../" target="_blank" rel="noopener">Ouvrir ↗</a>
</div>
<div class="stage"><iframe id="frame" title="Aperçu du site" src="../index.html"></iframe></div>
<script>
function show(v){
  var f=document.getElementById('frame'), o=document.getElementById('open');
  var src = v==='v1' ? '../v1/index.html' : '../index.html';
  var href = v==='v1' ? '../v1/' : '../';
  f.src=src; o.setAttribute('href',href);
  var b1=document.getElementById('b1'), b2=document.getElementById('b2');
  var on1=v==='v1';
  b1.classList.toggle('on',on1); b2.classList.toggle('on',!on1);
  b1.setAttribute('aria-selected',on1); b2.setAttribute('aria-selected',!on1);
}
</script>
</body>
</html>
